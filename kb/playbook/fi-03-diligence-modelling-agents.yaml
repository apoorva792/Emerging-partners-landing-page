id: fi-03-diligence-modelling-agents
archetype: finance-accounting-firm
name: Diligence and financial modelling agents
one_liner: Agents pull the filings, build the first-pass model and score the target,
  so analysts start from a draft instead of a blank sheet.
fits_when:
  - does transaction advisory, valuation, M&A support or investor services
  - clients are PE, VC, family offices or corp dev teams
  - mentions diligence, valuation, deal screening or investment committee
buyer: Partner / Head of Transaction Services
pitch_to_their_client: "Screen thirty targets in the time it took to screen three."
why_you: "Deal volume, not analyst headcount, becomes the limit on your fee income."
delivery:
  shape: 6-week build against their own model template, then seat-based
  team_needed: 1 senior analyst + 1 engineer
  lyzr_products: [Agent Studio]
first_offer:
  name: Diligence workflow review
  shape: 2 weeks, against one closed deal
  ends_with: a rerun of that deal showing what the analyst would have started from, and a pilot on a live one
proof:
  case: cs_how_lyzr_reduced_financial_model_preparation_from_10_hours_to_under_5_minutes
  customer: a leading investment and advisory firm
  named: false
  result: Financial model preparation dropped from 6–10 hours to under 5 minutes per target

id: hr-01-onboarding-automation
archetype: hr-consultancy
name: Employee onboarding automation
one_liner: Offer to first day handled end to end — documents, verification, accounts,
  induction — with the chasing done by agents.
fits_when:
  - does RPO, staffing, or HR shared-services work
  - clients hire at volume or across multiple countries
  - mentions onboarding, background checks or compliance documentation
buyer: CHRO / Head of People Operations
pitch_to_their_client: "Day one works, every time, without three people chasing it."
why_you: "You already run this process for them manually. You're productising
  the work you're currently doing with headcount."
delivery:
  shape: 6-week build on one hiring flow, then per-hire or monthly
  team_needed: 1 HR process lead + 1 engineer
  lyzr_products: [Agent Studio, Agent Architect]
first_offer:
  name: Onboarding journey audit
  shape: 2 weeks, one hiring flow
  ends_with: every handoff from offer to first day timed, and a scoped pilot on the slowest stretch
first_conversation: "Between offer accepted and first day, how many people chase a new hire, and what are they chasing?"
mechanism:
  - Agent sends and tracks every document the hire owes, in their language and timezone
  - Runs the verification and background checks the role requires, and records the result
  - Raises account, device and access requests to the systems that grant them
  - Reports which hires are at risk of missing day one, and why
discovery:
  - How many hires a month, across how many countries
  - Which checks are mandatory by role and which are discretionary
  - Which HRMS and ITSM systems hold the records
  - Who is accountable today when a hire shows up without a laptop
roles:
  partner: The hiring process they already run, the country compliance knowledge, and the HR team
  lyzr: Agent Studio and Agent Architect for the document, verification and provisioning agents
proof:
  case: cs_accenture_accubate
  customer: Accenture
  named: true
  result: Reduced onboarding timelines from weeks to days

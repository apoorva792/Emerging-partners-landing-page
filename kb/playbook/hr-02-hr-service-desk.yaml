id: hr-02-hr-service-desk
archetype: hr-consultancy
name: HR operations and employee service desk agents
one_liner: Policy questions, leave, payroll queries and letters answered on the spot,
  with escalation to a human only when it genuinely needs one.
fits_when:
  - implements or supports an HRMS (Workday, SuccessFactors, Darwinbox, Zoho People)
  - clients have 1000+ employees
  - mentions HR shared services, employee experience or an HR helpdesk
buyer: CHRO / HR Shared Services Head
pitch_to_their_client: "Your HR team stops answering the same 200 questions."
why_you: "You configured their HRMS. You know where the answers live and which
  policies actually apply — which is exactly what makes this work."
delivery:
  shape: 6–8 week build, then per-employee-per-month
  team_needed: 1 HR domain consultant + 1 engineer
  lyzr_products: [Agent Studio, Responsible AI]
first_offer:
  name: Employee query baseline
  shape: 2-3 weeks, one quarter of tickets
  ends_with: the queries that never needed a human, and a pilot on the top twenty
first_conversation: "What are the top twenty questions your HR team answers every week, and how many of them have a policy answer?"
mechanism:
  - Agent answers policy, leave and payroll questions from the client's own documents
  - Pulls the employee's own record when the answer depends on it
  - Generates standard letters and confirmations on request
  - Escalates to a human with the full thread when the policy does not cover it
discovery:
  - Ticket volume a quarter, and the share that are repeat questions
  - Whether policies are current, versioned and in one place
  - Which HRMS holds leave balances and payroll data
  - What the client requires before an agent may state a policy to an employee
roles:
  partner: The HRMS configuration they built, the policy set, and the HR shared services team
  lyzr: Agent Studio for the service desk agents, Responsible AI for what the agent may and may not answer
proof:
  case: cs_global_enterprise_streamlined_hr_engineering_qa_with_lyzr
  customer: a global enterprise
  named: false
  result: 75% reduction in HR workload

id: mk-03-audience-research-planning
archetype: marketing-agency
name: Audience research and media planning agents
one_liner: Planners ask a question and get a sourced answer, instead of commissioning
  a two-week research sprint.
fits_when:
  - sells strategy, planning or insights as a line item
  - mentions audience, segmentation, media planning or market research
  - has planners or strategists on the team page
buyer: Head of Strategy / Planning Director
pitch_to_their_client: "The plan is backed by research you can actually interrogate."
why_you: "Research is the part of your work that is hardest to price and easiest
  to lose on. This makes it repeatable, and gives your planners more at-bats."
delivery:
  shape: 5-week build against their own source set, then seat-based
  team_needed: 1 strategist + 1 engineer
  lyzr_products: [Agent Studio]
first_offer:
  name: Research request audit
  shape: 2 weeks, one quarter of briefs
  ends_with: where planners' questions actually go and what they cost, and a pilot on their own sources
proof:
  case: cs_multicultural_audience_intelligence
  customer: An independent media and marketing strategy agency
  named: false
  result: Up to 5x more research volume per planner

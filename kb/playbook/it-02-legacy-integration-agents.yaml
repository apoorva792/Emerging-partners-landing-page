id: it-02-legacy-integration-agents
archetype: it-consultancy-msp
also_fits: [infrastructure-sovereignty]
name: Brownfield integration agents
one_liner: Agents that read the documents and screens the old system can't expose —
  PDFs, emails, green-screen terminals — and push clean data into the new one.
growth_path: expand
topics:
  - it operations
  - orchestration as a service
  - ai & automation
fits_when:
  - mentions legacy modernisation, migration, mainframe, EDI, or "integration"
  - clients in telecom, logistics, manufacturing, insurance or public sector
  - sells long integration projects today
buyer: Head of IT / Programme Director
pitch_to_their_client: "You don't have to finish the migration before you get the benefit."
why_you: "Integration work is already what you sell. This is the same engagement
  with a far shorter path to a result the business can see."
delivery:
  shape: 6-week proof on one document type, then per-interface expansion
  team_needed: 1 integration engineer + 1 developer
  lyzr_products: [Agent Studio, OpenController]
first_offer:
  name: Integration feasibility proof
  shape: 2 weeks, one document type
  ends_with: a working extraction running against their real documents, and a plan for the next interface
first_conversation: "Which data does your team still rekey because the old system cannot hand it over?"
mechanism:
  - Agent reads the document, email or terminal screen the old system produces
  - Extracts the fields the new system needs and validates them against reference data
  - Sends anything it is unsure about to a reviewer, with the source shown
  - Pushes clean records into the target system through its supported interface
discovery:
  - Which document or screen types carry the volume
  - How many records a month and what rekeying costs today
  - What accuracy the business needs before it will trust the output
  - Whether the target system has an API or needs a file drop
roles:
  partner: The integration work they already sell, the knowledge of both systems, and the engineers
  lyzr: Agent Studio for the extraction agents, OpenController for monitoring in production
proof:
  case: cs_telecom_order_automation
  customer: a global leader in wireless communications infrastructure
  named: false
  result: Document extraction time reduced from 30 min to 3 min (90% faster than incumbent platform)

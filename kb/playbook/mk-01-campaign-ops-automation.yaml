id: mk-01-campaign-ops-automation
archetype: marketing-agency
name: Campaign operations agents
one_liner: The brief-to-live path — variants, localisation, trafficking, QA — run by
  agents, so a launch takes hours instead of days.
fits_when:
  - runs campaigns across multiple channels or markets
  - mentions localisation, always-on, or high campaign volume
  - has an ops or traffic function, not only creatives
buyer: Head of Growth / Marketing Ops / CMO
pitch_to_their_client: "Same brief. Live the same afternoon."
why_you: "You already own the brief and the channel relationships. The agent removes
  the production tax that stops you taking on more of their calendar."
delivery:
  shape: 4-week build on one campaign type, then a monthly ops retainer uplift
  team_needed: 1 marketing ops person + 1 engineer
  lyzr_products: [Agent Studio, Agent Architect]
first_offer:
  name: Campaign operations teardown
  shape: 2 weeks, one campaign type
  ends_with: brief-to-live timed step by step, and a pilot on the stage that costs the most hours
proof:
  case: cs_novitium
  customer: Novitium
  named: true
  result: Campaign launch time reduced by 85% (3 days to 4 hours)
